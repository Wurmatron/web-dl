plugins {
    id 'java'
}

group = 'io.wurmatron'
version = '0.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jsoup:jsoup:1.22.1'
}

jar {
    manifest {
        attributes 'Main-Class': 'io.wurmatron.webdl.WebDL'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}